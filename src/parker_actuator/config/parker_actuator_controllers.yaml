controller_manager:
  ros__parameters:
    update_rate: 50  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    parker_controller:
      type: joint_trajectory_controller/JointTrajectoryController

parker_controller:
  ros__parameters:
    joints:
      - slider_joint
    command_interfaces:
      - position
      - velocity
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 40.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.0
      slider_joint: { trajectory: 0.1, goal: 0.1 }
