ompl:
  planning_plugin: ompl_interface/OMPLPlanner
  request_adapters:
    - moveit_ros_planning_interface/AddTimeOptimalParameterization
    - moveit_ros_planning_interface/ResolveConstraintFrames
    - moveit_ros_planning_interface/FixWorkspaceBounds
    - moveit_ros_planning_interface/FixStartStateBounds
    - moveit_ros_planning_interface/FixStartStateCollision
    - moveit_ros_planning_interface/FixStartStatePathConstraints
  start_state_max_bounds_error: 0.1

  ur5_arm:
    default_planner_config: RRTConnect
    planner_configs:
      - RRTConnect
      - RRT
      - PRM
      - TRRT
      - EST

  planner_configs:
    RRTConnect:
      type: geometric::RRTConnect
      range: 0.0
    RRT:
      type: geometric::RRT
      range: 0.0
      goal_bias: 0.05
    PRM:
      type: geometric::PRM
      max_nearest_neighbors: 10
    TRRT:
      type: geometric::TRRT
      range: 0.0
      goal_bias: 0.05
      temp_change_factor: 2.0
    EST:
      type: geometric::EST
      range: 0.0
      goal_bias: 0.05
